name: Sincronizar reposições CGD

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Uma execução por hora evita rajadas desnecessárias contra o CGD.
  schedule:
    - cron: '0 * * * *'

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Chrome real
        uses: browser-actions/setup-chrome@v1

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cgd.txt
          python -m playwright install --with-deps chromium

      - name: Sincronizar CGD -> Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CGD_LOGIN_URL: https://app.cgd.com.br/login
          CGD_REPORT_URL: https://app.cgd.com.br/relatorios/alunos-professor
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_REPOSICOES_URL_MATRIZ: ${{ secrets.CGD_REPOSICOES_URL_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_REPOSICOES_URL_FILIAL: ${{ secrets.CGD_REPOSICOES_URL_FILIAL }}
          CGD_MATRIZ_USERNAME: ${{ secrets.CGD_MATRIZ_USERNAME }}
          CGD_MATRIZ_PASSWORD: ${{ secrets.CGD_MATRIZ_PASSWORD }}
          CGD_FILIAL_USERNAME: ${{ secrets.CGD_FILIAL_USERNAME }}
          CGD_FILIAL_PASSWORD: ${{ secrets.CGD_FILIAL_PASSWORD }}
          CGD_BASE_URL: https://app.cgd.com.br
          CGD_USERNAME: ${{ secrets.CGD_USERNAME }}
          CGD_PASSWORD: ${{ secrets.CGD_PASSWORD }}
        run: python scripts/run_sync_cgd.py
